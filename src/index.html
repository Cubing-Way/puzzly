<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Puzzle Engine</title>
        <link rel="stylesheet" href="index.css" />
    </head>
    <body>
        <!-- Page title and live status line -->
        <header class="top">
            <h1>Puzzle Engine <span>solver test bench</span></h1>
            <p id="status" class="status" role="status">Loading…</p>
        </header>

        <main class="layout">
            <!-- Inputs: start position, goal, allowed moves -->
            <form id="solve-form" class="panel controls">
                <!-- Start position -->
                <section class="group">
                    <label for="scramble-input" class="label">Start position <small>moves from solved</small></label>
                    <textarea id="scramble-input" rows="3" spellcheck="false" autocomplete="off"></textarea>
                    <p id="scramble-error" class="error"></p>
                    <!-- Moves earlier steps did (Continue adds here); they change the grip only through x, y, z -->
                    <label for="done-input" class="label">Done so far <small>earlier steps, after the scramble</small></label>
                    <input id="done-input" type="text" spellcheck="false" autocomplete="off" placeholder="nothing yet" />
                    <p id="done-error" class="error"></p>
                    <div class="row">
                        <button id="random-button" type="button">New scramble</button>
                        <button id="clear-button" type="button" class="quiet">Clear</button>
                    </div>
                </section>

                <!-- What to solve -->
                <section class="group">
                    <span class="label">Goal</span>
                    <div class="segmented">
                        <label><input type="radio" name="mode" value="step" checked /> Step</label>
                        <label><input type="radio" name="mode" value="full" /> Full cube</label>
                    </div>
                </section>

                <!-- Step options (turned off for full solves) -->
                <fieldset id="step-options" class="group">
                    <!-- Preset goals -->
                    <label for="preset-select" class="label">Preset</label>
                    <select id="preset-select">
                        <option value="DF DR DB DL">Cross</option>
                        <option value="DF DR DB DL DFR FR">XCross (front-right pair)</option>
                        <option value="DF DR DB DL DFR DFL DBL DBR">First layer (slow, ~10 s)</option>
                        <option value="UF:o UR:o UB:o UL:o DF:o DR:o DB:o DL:o FR:o FL:o BR:o BL:o">EO (all edges oriented)</option>
                        <option value="UF:o UR:o UB:o UL:o DF DR:o DB DL:o FR:o FL:o BR:o BL:o">EOLine (EO + DF, DB)</option>
                        <option value="UFR:o UBR:o UBL:o UFL:o DFR:o DFL:o DBL:o DBR:o">CO (all corners oriented)</option>
                        <option value="UFR:p UBR:p UBL:p UFL:p DFR:p DFL:p DBL:p DBR:p">CP (all corners in place)</option>
                        <option value="UFR:o UBR:o UBL:o UFL:o DFR:o DFL:o DBL:o DBR:o UF:o UR:o UB:o UL:o DF:o DR:o DB:o DL:o FR:o2 FL:o2 BR:o2 BL:o2">DR (domino reduction)</option>
                        <option value="L DL FL BL DFL DBL">Roux first block (allow M)</option>
                        <option value="">Custom</option>
                    </select>

                    <!-- Pieces to solve: typed, or set with the chips -->
                    <label for="pieces-input" class="label">Pieces <small>no center picked = all six kept</small></label>
                    <input id="pieces-input" type="text" spellcheck="false" autocomplete="off" />
                    <p id="pieces-error" class="error"></p>
                    <!-- Role a chip click gives (clicking a chip that already has it removes the piece) -->
                    <div class="brush">
                        <label for="role-select">Chip click sets</label>
                        <select id="role-select">
                            <option value="">solved (home, turned right)</option>
                            <option value=":o">:o oriented, group 1</option>
                            <option value=":o2">:o2 oriented, group 2</option>
                            <option value=":o3">:o3 oriented, group 3</option>
                            <option value=":s">:s anywhere in group 1, any turn</option>
                            <option value=":s2">:s2 anywhere in group 2, any turn</option>
                            <option value=":p">:p in place, any turn</option>
                        </select>
                    </div>
                    <div id="edge-chips" class="chips" aria-label="Edges"></div>
                    <div id="corner-chips" class="chips" aria-label="Corners"></div>
                    <div id="center-chips" class="chips" aria-label="Centers"></div>
                    <!-- Grips to try: faces that may go on the bottom (the shortest answer wins) -->
                    <span class="label">Bottom face <small>as held now; shortest wins</small></span>
                    <div class="moves">
                        <label><input type="checkbox" name="bottom" value="D" checked />D</label>
                        <label><input type="checkbox" name="bottom" value="U" />U</label>
                        <label><input type="checkbox" name="bottom" value="F" />F</label>
                        <label><input type="checkbox" name="bottom" value="B" />B</label>
                        <label><input type="checkbox" name="bottom" value="R" />R</label>
                        <label><input type="checkbox" name="bottom" value="L" />L</label>
                        <label><input id="any-front" type="checkbox" />any front (y turns)</label>
                    </div>

                    <!-- Offsets: the goal also counts when the cube is off by one of these moves (the solution leaves it in) -->
                    <label for="offsets-input" class="label">Offsets <small>goal also counts off by these; no offset is always tried</small></label>
                    <div class="row offsets">
                        <input id="offsets-input" type="text" spellcheck="false" autocomplete="off" placeholder="none (e.g. D D2 D')" />
                        <!-- Quick picks -->
                        <button type="button" class="quiet" data-offsets="">None</button>
                        <button type="button" data-offsets="U U2 U'">AUF</button>
                        <button type="button" data-offsets="D D2 D'">ADF</button>
                    </div>
                    <p id="offsets-error" class="error"></p>
                    <!-- Searches a step solve may run -->
                    <p id="search-count" class="hint"></p>

                    <!-- Moves the search may use -->
                    <span class="label">Moves allowed</span>
                    <div class="moves">
                        <label><input type="checkbox" name="move" value="U" checked />U</label>
                        <label><input type="checkbox" name="move" value="R" checked />R</label>
                        <label><input type="checkbox" name="move" value="F" checked />F</label>
                        <label><input type="checkbox" name="move" value="D" checked />D</label>
                        <label><input type="checkbox" name="move" value="L" checked />L</label>
                        <label><input type="checkbox" name="move" value="B" checked />B</label>
                        <label><input type="checkbox" name="move" value="M" />M</label>
                        <label><input type="checkbox" name="move" value="E" />E</label>
                        <label><input type="checkbox" name="move" value="S" />S</label>
                    </div>

                    <!-- Optional search limit -->
                    <label for="max-depth" class="label">Max depth <small>empty = no limit</small></label>
                    <input id="max-depth" type="number" min="1" max="30" placeholder="no limit" />
                    <!-- Faster mode: stop at the first grip × offset with an answer (within max depth) instead of comparing them all -->
                    <div class="moves">
                        <label><input id="first-found" type="checkbox" />stop at first answer (any within max depth)</label>
                    </div>
                </fieldset>

                <button id="solve-button" type="submit" class="primary">Solve</button>
            </form>

            <!-- 3D viewer and the latest result -->
            <section class="panel viewer">
                <div id="player-slot" class="player-slot"></div>
                <div class="result">
                    <span class="label">Solution</span>
                    <p id="solution" class="solution">—</p>
                    <!-- Numbers for the shown solve -->
                    <dl class="stats">
                        <div><dt>Moves</dt><dd id="moves-stat">—</dd></div>
                        <div><dt>Time</dt><dd id="time-stat">—</dd></div>
                        <div><dt>Check</dt><dd id="check-stat">—</dd></div>
                        <div><dt>Offset</dt><dd id="offset-stat">—</dd></div>
                    </dl>
                    <div class="row">
                        <button id="continue-button" type="button" disabled>Continue from here</button>
                        <button id="copy-button" type="button" class="quiet" disabled>Copy</button>
                    </div>
                </div>
            </section>

            <!-- Every solve in this session (click a row to see it again) -->
            <section class="panel runs">
                <h2>Runs</h2>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr><th>#</th><th>Goal</th><th>Moves</th><th>Offset</th><th>Time</th><th>Check</th><th>Solution</th></tr>
                        </thead>
                        <tbody id="runs-body"></tbody>
                    </table>
                </div>
                <p id="runs-empty" class="empty">No solves yet.</p>
            </section>
        </main>

        <script type="module" src="main.js"></script>
    </body>
</html>
