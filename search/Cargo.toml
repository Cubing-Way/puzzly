# Rust side of puzzly's search: twips searches kept alive between calls, built to WebAssembly with wasm-pack
[package]
name = "puzzly-search"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# A WebAssembly library for the browser
crate-type = ["cdylib"]

[dependencies]
# The search engine behind cubing.js's experimentalSolveTwips
twips = "0.12.3"
# Puzzle, pattern and move types twips works with (same version twips uses)
cubing = "0.15.2"
# JS <-> Rust glue
wasm-bindgen = "0.2.105"
# Reads the JSON the worker sends
serde_json = "1.0.145"
# Shows Rust panics in the browser console
console_error_panic_hook = "0.1.7"
# Not used directly, but twips's random numbers need its browser backend turned on
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[profile.release]
# Fastest code: whole-program optimization in one unit
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
# Optimize with wasm-opt (it reads the WebAssembly features to allow from the file)
wasm-opt = ["-O3"]
